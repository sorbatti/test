<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera / PiP Test</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:16px}
video{width:100%;background:#000;border-radius:8px;margin-top:8px}
select,button{font-size:16px;padding:10px;margin:4px}
button:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#status{background:#222;padding:10px;border-radius:8px;font:12px monospace;white-space:pre-wrap;max-height:350px;overflow:auto}
.small{font-size:13px;color:#aaa;line-height:1.6}
.hiddenVideo{position:fixed;width:2px;height:2px;left:-20px;top:-20px;opacity:.01;pointer-events:none}
</style>
</head>
<body>
<main>

<h2>Camera / PiP Test</h2>

<div class="row">
<select id="cameraMode">
    <option value="environment" selected>背面カメラ</option>
    <option value="user">前面カメラ</option>
</select>
<button id="startCamera">カメラ開始 / 切替</button>
</div>

<div class="row">
<button id="startRec" disabled>録画開始</button>
<button id="stopRec" disabled>録画停止</button>
</div>

<h3>PiPテスト</h3>

<div class="row">
<button id="pipCamera" disabled>A: Camera直接PiP</button>
<button id="pipCanvas" disabled>B: Canvas経由PiP</button>
<button id="pipDummy" disabled>C: 別動画PiP</button>
<button id="exitPip">PiP終了</button>
</div>

<div class="small">
A = getUserMedia のカメラ映像そのものをPiP<br>
B = カメラ → Canvas → captureStream → 別video → PiP<br>
C = カメラとは無関係な通常動画をPiP<br><br>
PiP方式を変更するときは、一度「PiP終了」を押してから別のPiPボタンを押してください。
</div>

<h3>Live Camera</h3>
<video id="live" autoplay muted playsinline></video>

<canvas id="copyCanvas" style="display:none"></canvas>

<video
    id="canvasVideo"
    class="hiddenVideo"
    autoplay
    muted
    playsinline>
</video>

<video
    id="dummyVideo"
    class="hiddenVideo"
    muted
    loop
    playsinline
    preload="auto"
    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
</video>

<h3>Recorded</h3>
<video id="playback" controls playsinline></video>

<div class="row">
<a id="download" hidden><button>録画保存</button></a>
</div>

<h3>Status</h3>
<div id="status"></div>

</main>

<script>
const $=s=>document.querySelector(s);

const cameraMode=$('#cameraMode');
const live=$('#live');
const playback=$('#playback');
const copyCanvas=$('#copyCanvas');
const canvasVideo=$('#canvasVideo');
const dummyVideo=$('#dummyVideo');
const statusBox=$('#status');

const startCameraBtn=$('#startCamera');
const startRecBtn=$('#startRec');
const stopRecBtn=$('#stopRec');
const pipCameraBtn=$('#pipCamera');
const pipCanvasBtn=$('#pipCanvas');
const pipDummyBtn=$('#pipDummy');

let stream=null;
let recorder=null;
let chunks=[];
let recordedURL=null;

let canvasStream=null;
let canvasRAF=null;

let freezeCheckTimer=null;
let lastVideoTime=-1;

function log(msg){
    const t=new Date().toLocaleTimeString();
    statusBox.textContent+=`[${t}] ${msg}\n`;
    statusBox.scrollTop=statusBox.scrollHeight;
}

function stopCanvasCopy(){
    if(canvasRAF!==null){
        cancelAnimationFrame(canvasRAF);
        canvasRAF=null;
    }

    if(canvasStream){
        canvasStream.getTracks().forEach(t=>t.stop());
        canvasStream=null;
    }

    canvasVideo.srcObject=null;
}

async function prepareCanvasCopy(){
    stopCanvasCopy();

    if(!stream)return;

    const videoTrack=stream.getVideoTracks()[0];
    const settings=videoTrack?.getSettings()||{};

    copyCanvas.width=settings.width||1280;
    copyCanvas.height=settings.height||720;

    const ctx=copyCanvas.getContext('2d');

    const draw=()=>{
        try{
            if(live.readyState>=2){
                ctx.drawImage(
                    live,
                    0,
                    0,
                    copyCanvas.width,
                    copyCanvas.height
                );
            }
        }catch(e){}

        canvasRAF=requestAnimationFrame(draw);
    };

    draw();

    try{
        canvasStream=copyCanvas.captureStream(30);
        canvasVideo.srcObject=canvasStream;
        await canvasVideo.play();
        log('Canvas PiP準備完了');
    }catch(e){
        log(`Canvas準備 ERROR: ${e.name}: ${e.message}`);
    }
}

async function prepareDummy(){
    try{
        await dummyVideo.play();
        log('Dummy video準備完了');
    }catch(e){
        log(`Dummy準備: ${e.name}: ${e.message}`);
    }
}

async function startCamera(){
    try{
        if(document.pictureInPictureElement){
            log('先にPiPを終了してください');
            return;
        }

        stopCanvasCopy();

        if(stream){
            stream.getTracks().forEach(t=>t.stop());
            stream=null;
        }

        const mode=cameraMode.value;

        log(`カメラ要求: ${mode}`);

        try{
            stream=await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{exact:mode}
                },
                audio:true
            });
        }catch(e){
            log(`exact失敗 → idealで再試行: ${e.name}`);

            stream=await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{ideal:mode}
                },
                audio:true
            });
        }

        live.srcObject=stream;
        await live.play();

        const videoTrack=stream.getVideoTracks()[0];

        log(`選択モード=${mode}`);
        log(`実際のカメラ=${videoTrack?.label||'(labelなし)'}`);

        if(videoTrack){
            try{
                log(`settings=${JSON.stringify(videoTrack.getSettings())}`);
            }catch(e){}
        }

        for(const track of stream.getTracks()){
            track.addEventListener('mute',()=>{
                log(`${track.kind} TRACK MUTED`);
            });

            track.addEventListener('unmute',()=>{
                log(`${track.kind} TRACK UNMUTED`);
            });

            track.addEventListener('ended',()=>{
                log(`${track.kind} TRACK ENDED`);
            });
        }

        await prepareCanvasCopy();
        await prepareDummy();

        startRecBtn.disabled=false;
        pipCameraBtn.disabled=false;
        pipCanvasBtn.disabled=false;
        pipDummyBtn.disabled=false;

        startFreezeMonitor();

        log('カメラ開始');
    }catch(e){
        log(`getUserMedia ERROR: ${e.name}: ${e.message}`);
    }
}

function getMime(){
    const types=[
        'video/mp4;codecs=h264,aac',
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
    ];

    for(const type of types){
        try{
            if(MediaRecorder.isTypeSupported(type)){
                return type;
            }
        }catch(e){}
    }

    return '';
}

function startRecording(){
    if(!stream)return;

    chunks=[];

    try{
        const mime=getMime();

        recorder=mime
            ? new MediaRecorder(stream,{mimeType:mime})
            : new MediaRecorder(stream);

        log(`Recorder MIME=${recorder.mimeType||mime||'default'}`);

        recorder.addEventListener('dataavailable',e=>{
            if(e.data && e.data.size>0){
                chunks.push(e.data);
                log(`chunk ${e.data.size} bytes`);
            }
        });

        recorder.addEventListener('error',e=>{
            log(`Recorder ERROR: ${e.error?.message||e}`);
        });

        recorder.addEventListener('stop',()=>{
            const type=recorder.mimeType||mime||'video/webm';
            const blob=new Blob(chunks,{type});

            if(recordedURL){
                URL.revokeObjectURL(recordedURL);
            }

            recordedURL=URL.createObjectURL(blob);

            playback.src=recordedURL;
            playback.load();

            const ext=type.includes('mp4')?'mp4':'webm';

            $('#download').href=recordedURL;
            $('#download').download=`pip_test_${Date.now()}.${ext}`;
            $('#download').hidden=false;

            log(`録画完成 ${(blob.size/1024/1024).toFixed(2)} MB`);
        });

        recorder.start(1000);

        startRecBtn.disabled=true;
        stopRecBtn.disabled=false;

        log('========= 録画開始 =========');
    }catch(e){
        log(`Recorder ERROR: ${e.name}: ${e.message}`);
    }
}

function stopRecording(){
    if(recorder && recorder.state!=='inactive'){
        recorder.stop();

        startRecBtn.disabled=false;
        stopRecBtn.disabled=true;

        log('========= 録画停止 =========');
    }
}

function requestCameraPip(){
    log('----- A: Camera直接PiP 要求 -----');

    if(document.pictureInPictureElement){
        log('ERROR: すでにPiP中');
        return;
    }

    try{
        live.requestPictureInPicture()
            .then(()=>log('A: Camera直接PiP 成功'))
            .catch(e=>log(`A PiP ERROR: ${e.name}: ${e.message}`));
    }catch(e){
        log(`A PiP ERROR: ${e.name}: ${e.message}`);
    }
}

function requestCanvasPip(){
    log('----- B: Canvas経由PiP 要求 -----');

    if(document.pictureInPictureElement){
        log('ERROR: すでにPiP中');
        return;
    }

    if(!canvasVideo.srcObject){
        log('ERROR: Canvas PiP未準備');
        return;
    }

    try{
        canvasVideo.requestPictureInPicture()
            .then(()=>log('B: Canvas経由PiP 成功'))
            .catch(e=>log(`B PiP ERROR: ${e.name}: ${e.message}`));
    }catch(e){
        log(`B PiP ERROR: ${e.name}: ${e.message}`);
    }
}

function requestDummyPip(){
    log('----- C: 別動画PiP 要求 -----');

    if(document.pictureInPictureElement){
        log('ERROR: すでにPiP中');
        return;
    }

    try{
        dummyVideo.requestPictureInPicture()
            .then(()=>log('C: 別動画PiP 成功'))
            .catch(e=>log(`C PiP ERROR: ${e.name}: ${e.message}`));
    }catch(e){
        log(`C PiP ERROR: ${e.name}: ${e.message}`);
    }
}

function exitPip(){
    if(!document.pictureInPictureElement){
        log('PiPは現在開いていません');
        return;
    }

    document.exitPictureInPicture()
        .then(()=>log('PiP終了'))
        .catch(e=>log(`PiP終了 ERROR: ${e.name}: ${e.message}`));
}

function dumpState(reason){
    log(`--- STATE: ${reason} ---`);
    log(`visibility=${document.visibilityState}`);
    log(`focus=${document.hasFocus()}`);
    log(`PiP=${document.pictureInPictureElement?'YES':'NO'}`);

    if(stream){
        for(const t of stream.getTracks()){
            log(
                `${t.kind}: `+
                `readyState=${t.readyState} `+
                `enabled=${t.enabled} `+
                `muted=${t.muted}`
            );
        }
    }

    if(recorder){
        log(`MediaRecorder=${recorder.state}`);
    }

    log(`live.currentTime=${live.currentTime.toFixed(2)}`);
}

function startFreezeMonitor(){
    clearInterval(freezeCheckTimer);

    lastVideoTime=live.currentTime;

    freezeCheckTimer=setInterval(()=>{
        if(!stream)return;

        const t=live.currentTime;

        if(
            recorder?.state==='recording' &&
            document.visibilityState==='visible' &&
            Math.abs(t-lastVideoTime)<0.01
        ){
            log(`WARNING: Live映像停止? currentTime=${t.toFixed(2)}`);
        }

        lastVideoTime=t;
    },3000);
}

document.addEventListener('visibilitychange',()=>{
    dumpState(`visibilitychange → ${document.visibilityState}`);
});

window.addEventListener('focus',()=>{
    log('WINDOW FOCUS');
    dumpState('focus');
});

window.addEventListener('blur',()=>{
    log('WINDOW BLUR');
    dumpState('blur');
});

[
    ['Camera',live],
    ['Canvas',canvasVideo],
    ['Dummy',dummyVideo]
].forEach(([name,v])=>{

    v.addEventListener('enterpictureinpicture',()=>{
        log(`${name}: ENTER PiP`);
        dumpState(`${name} ENTER PiP`);
    });

    v.addEventListener('leavepictureinpicture',()=>{
        log(`${name}: LEAVE PiP`);
        dumpState(`${name} LEAVE PiP`);
    });

    v.addEventListener('playing',()=>{
        log(`${name}: playing`);
    });

    v.addEventListener('pause',()=>{
        log(`${name}: pause`);
    });

    v.addEventListener('waiting',()=>{
        log(`${name}: waiting`);
    });

    v.addEventListener('stalled',()=>{
        log(`${name}: stalled`);
    });

    v.addEventListener('error',()=>{
        const e=v.error;
        log(`${name}: VIDEO ERROR ${e?e.code:'unknown'}`);
    });
});

startCameraBtn.addEventListener('click',()=>{
    startCamera();
});

startRecBtn.addEventListener('click',()=>{
    startRecording();
});

stopRecBtn.addEventListener('click',()=>{
    stopRecording();
});

pipCameraBtn.addEventListener('click',requestCameraPip);
pipCanvasBtn.addEventListener('click',requestCanvasPip);
pipDummyBtn.addEventListener('click',requestDummyPip);

$('#exitPip').addEventListener('click',exitPip);

cameraMode.addEventListener('change',()=>{
    if(stream){
        startCamera();
    }
});

(async()=>{
    log(`secureContext=${window.isSecureContext}`);
    log(`PiP API=${document.pictureInPictureEnabled}`);
    log(`UA=${navigator.userAgent}`);

    if(!navigator.mediaDevices?.getUserMedia){
        log('ERROR: getUserMedia非対応またはSecure Contextではありません');
        return;
    }

    log('準備完了');
    log('「カメラ開始 / 切替」を押してください');
})();
</script>
</body>
</html>
