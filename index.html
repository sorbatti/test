<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera Recorder Test</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:16px}
video{width:100%;background:#000;border-radius:10px;margin-top:10px}
select,button{font-size:16px;padding:10px;margin:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#status{white-space:pre-wrap;background:#222;padding:10px;border-radius:8px;font-family:monospace;font-size:12px;max-height:300px;overflow:auto}
button:disabled{opacity:.4}
</style>
</head>
<body>
<main>
<h2>Camera Recorder Test</h2>

<div class="row">
<select id="camera"></select>
<button id="refresh">カメラ更新</button>
</div>

<div class="row">
<button id="startCamera">カメラ開始</button>
<button id="startRec" disabled>録画開始</button>
<button id="stopRec" disabled>録画停止</button>
<button id="pip" disabled>PiP</button>
</div>

<h3>Live</h3>
<video id="live" autoplay muted playsinline></video>

<h3>Recorded</h3>
<video id="playback" controls playsinline></video>

<div class="row">
<a id="download" hidden>
<button>録画ファイル保存</button>
</a>
</div>

<h3>Status</h3>
<div id="status"></div>
</main>

<script>
const camera = document.querySelector('#camera');
const live = document.querySelector('#live');
const playback = document.querySelector('#playback');
const statusBox = document.querySelector('#status');
const startCameraBtn = document.querySelector('#startCamera');
const startRecBtn = document.querySelector('#startRec');
const stopRecBtn = document.querySelector('#stopRec');
const pipBtn = document.querySelector('#pip');
const refreshBtn = document.querySelector('#refresh');
const download = document.querySelector('#download');

let stream = null;
let recorder = null;
let chunks = [];
let recordedURL = null;

function log(msg){
    const t = new Date().toLocaleTimeString();
    statusBox.textContent += `[${t}] ${msg}\n`;
    statusBox.scrollTop = statusBox.scrollHeight;
}

async function enumerateCameras(){
    try{
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        const current = camera.value;
        camera.innerHTML = '';

        cams.forEach((d,i)=>{
            const option = document.createElement('option');
            option.value = d.deviceId;
            option.textContent = d.label || `Camera ${i+1}`;
            camera.appendChild(option);
        });

        if([...camera.options].some(o => o.value === current)){
            camera.value = current;
        }

        log(`カメラ ${cams.length}台`);
    }catch(e){
        log(`enumerateDevices error: ${e.name}: ${e.message}`);
    }
}

async function startCamera(){
    try{
        if(stream){
            stream.getTracks().forEach(t => t.stop());
        }

        const deviceId = camera.value;

        stream = await navigator.mediaDevices.getUserMedia({
            video: deviceId
                ? {deviceId:{exact:deviceId}}
                : {facingMode:{ideal:'environment'}},
            audio:true
        });

        live.srcObject = stream;
        await live.play();

        for(const track of stream.getTracks()){
            log(`${track.kind}: ${track.label}`);
            track.addEventListener('mute',()=>{
                log(`${track.kind} track muted`);
            });
            track.addEventListener('unmute',()=>{
                log(`${track.kind} track unmuted`);
            });
            track.addEventListener('ended',()=>{
                log(`${track.kind} track ended`);
            });
        }

        startRecBtn.disabled = false;
        pipBtn.disabled = false;

        await enumerateCameras();
        log('カメラ開始');
    }catch(e){
        log(`getUserMedia error: ${e.name}: ${e.message}`);
    }
}

function getMime(){
    const candidates = [
        'video/mp4;codecs=h264,aac',
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
    ];

    for(const type of candidates){
        if(MediaRecorder.isTypeSupported(type)){
            return type;
        }
    }

    return '';
}

function startRecording(){
    if(!stream) return;

    chunks = [];

    try{
        const mime = getMime();

        recorder = mime
            ? new MediaRecorder(stream,{mimeType:mime})
            : new MediaRecorder(stream);

        log(`Recorder MIME: ${recorder.mimeType || mime || 'default'}`);

        recorder.ondataavailable = e=>{
            if(e.data && e.data.size > 0){
                chunks.push(e.data);
                log(`chunk ${e.data.size} bytes`);
            }
        };

        recorder.onerror = e=>{
            log(`Recorder error: ${e.error?.message || e}`);
        };

        recorder.onstop = ()=>{
            const type = recorder.mimeType || 'video/webm';
            const blob = new Blob(chunks,{type});

            if(recordedURL){
                URL.revokeObjectURL(recordedURL);
            }

            recordedURL = URL.createObjectURL(blob);

            playback.src = recordedURL;
            playback.load();

            const ext = type.includes('mp4') ? 'mp4' : 'webm';

            download.href = recordedURL;
            download.download = `recording_${Date.now()}.${ext}`;
            download.hidden = false;

            log(`録画完了 ${(blob.size/1024/1024).toFixed(2)}MB`);
        };

        recorder.start(1000);

        startRecBtn.disabled = true;
        stopRecBtn.disabled = false;

        log('録画開始');
    }catch(e){
        log(`録画開始エラー: ${e.name}: ${e.message}`);
    }
}

function stopRecording(){
    if(recorder && recorder.state !== 'inactive'){
        recorder.stop();
        startRecBtn.disabled = false;
        stopRecBtn.disabled = true;
        log('録画停止');
    }
}

async function startPiP(){
    try{
        if(document.pictureInPictureElement){
            await document.exitPictureInPicture();
            log('PiP終了');
            return;
        }

        if(!document.pictureInPictureEnabled){
            log('Picture-in-Picture API非対応');
            return;
        }

        await live.requestPictureInPicture();
        log('PiP開始');
    }catch(e){
        log(`PiP error: ${e.name}: ${e.message}`);
    }
}

function dumpState(){
    log(`visibility=${document.visibilityState}`);
    log(`focus=${document.hasFocus()}`);

    if(stream){
        for(const t of stream.getTracks()){
            log(
                `${t.kind}: readyState=${t.readyState}, enabled=${t.enabled}, muted=${t.muted}`
            );
        }
    }

    if(recorder){
        log(`MediaRecorder=${recorder.state}`);
    }
}

document.addEventListener('visibilitychange', dumpState);
window.addEventListener('focus',()=>log('window focus'));
window.addEventListener('blur',()=>log('window blur'));

live.addEventListener('enterpictureinpicture',()=>{
    log('enterpictureinpicture');
});

live.addEventListener('leavepictureinpicture',()=>{
    log('leavepictureinpicture');
});

refreshBtn.onclick = enumerateCameras;
startCameraBtn.onclick = startCamera;
startRecBtn.onclick = startRecording;
stopRecBtn.onclick = stopRecording;
pipBtn.onclick = startPiP;

camera.addEventListener('change',async()=>{
    if(stream){
        await startCamera();
    }
});

(async()=>{
    log(`secureContext=${window.isSecureContext}`);
    log(`PiP API=${document.pictureInPictureEnabled}`);
    log(navigator.userAgent);

    try{
        const temp = await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:true
        });

        temp.getTracks().forEach(t=>t.stop());

        await enumerateCameras();

        log('初期権限取得OK');
    }catch(e){
        log(`初期権限取得: ${e.name}: ${e.message}`);
    }
})();
</script>
</body>
</html>
